<style>
  :root{
    --leaf-600:#16a34a;
    --leaf-700:#15803d;
    --leaf-50:#f0fdf4;
  }
  html,body{ height:100%; overflow:hidden; }
  body{
    font-family:'Noto Sans KR','Inter',sans-serif;
    background:#f0fdf4;
  }
  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:#bbf7d0; border-radius:4px; }
  ::-webkit-scrollbar-thumb:hover{ background:#86efac; }

  #map{ width:100%; height:100%; background:#e2f5e9; }
  .leaflet-container{ font-family:'Noto Sans KR','Inter',sans-serif; }

  /* custom plant marker */
  .plant-pin{
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    background: var(--leaf-600);
    border:3px solid #fff;
    border-radius:50% 50% 50% 0;
    transform: rotate(-45deg);
    box-shadow:0 2px 6px rgba(0,0,0,.35);
  }
  .plant-pin i{ transform: rotate(45deg); color:#fff; font-size:14px; }
  .plant-pin.active{ background:#f59e0b; }

  /* cluster theme */
  .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large{
    background-color: rgba(22,163,74,0.25) !important;
  }
  .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div{
    background-color: rgba(21,128,61,0.85) !important;
    color:#fff; font-weight:700; font-family:'Noto Sans KR',sans-serif;
  }

  .screen-slide{ transition: transform .32s cubic-bezier(.25,.8,.3,1); }
  .sheet-slide{ transition: transform .28s cubic-bezier(.25,.8,.3,1); }

  .leaflet-control-attribution{ font-size:9px !important; }

  .plant-photo-fallback{
    background: repeating-linear-gradient(135deg, #dcfce7, #dcfce7 10px, #f0fdf4 10px, #f0fdf4 20px);
  }

  @keyframes pop-in{ from{ opacity:0; transform:scale(.92);} to{ opacity:1; transform:scale(1);} }
  .pop-in{ animation: pop-in .25s ease-out; }
</style>
</head>
<body class="text-slate-800">

    </div>

              <p id="statRain" class="text-sm font-bold text-slate-800"></p>

            </div>
            <div class="bg-white border border-slate-100 rounded-xl p-3 text-center shadow-sm">
              <i class="fa-solid fa-sun text-amber-400 mb-1"></i>

          <div class="flex items-center justify-between gap-3 pt-2 pb-6">

          </div>

    <!-- List Drawer -->

/* ---------- helpers ---------- */
function photoUrl(id, attempt){
  if(attempt === 0) return `https://drive.google.com/thumbnail?id=${id}&sz=w1000`;
  return `https://lh3.googleusercontent.com/d/${id}=w1000`;
}
function fmt(n, unit, digits=1){
  if(n === null || n === undefined) return '-';
  return `${Number(n).toFixed(digits)}${unit}`;
}
function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- map setup ---------- */
const lats = PLANTS.map(p=>p.lat), lngs = PLANTS.map(p=>p.lng);
const south = Math.min(...lats) - 0.0009, north = Math.max(...lats) + 0.0009;
const west  = Math.min(...lngs) - 0.0009, east  = Math.max(...lngs) + 0.0009;
const centerLat = (Math.min(...lats)+Math.max(...lats))/2;
const centerLng = (Math.min(...lngs)+Math.max(...lngs))/2;
const schoolBounds = L.latLngBounds([south, west], [north, east]);

const map = L.map('map', {
  center: [centerLat, centerLng],
  zoom: 18,
  minZoom: 16,
  maxZoom: 21,
  maxBounds: schoolBounds.pad(0.6),
  maxBoundsViscosity: 0.9,
  zoomControl: false
});
L.control.zoom({ position:'bottomleft' }).addTo(map);

function googleLayer(type){
  return L.tileLayer(`https://{s}.google.com/vt/lyrs=${type}&x={x}&y={y}&z={z}`, {
    subdomains: ['mt0','mt1','mt2','mt3'],
    attribution: '&copy; Google Maps',
    maxZoom: 21
  });
}
const roadmapLayer = googleLayer('m');
const satelliteLayer = googleLayer('y');
roadmapLayer.addTo(map);
let currentLayer = 'road';

document.getElementById('btnRoadmap').addEventListener('click', ()=>{
  if(currentLayer==='road') return;
  map.removeLayer(satelliteLayer); roadmapLayer.addTo(map); currentLayer='road';
  setLayerBtnStyle();
});
document.getElementById('btnSatellite').addEventListener('click', ()=>{
  if(currentLayer==='sat') return;
  map.removeLayer(roadmapLayer); satelliteLayer.addTo(map); currentLayer='sat';
  setLayerBtnStyle();
});
function setLayerBtnStyle(){
  const road = document.getElementById('btnRoadmap');
  const sat = document.getElementById('btnSatellite');
  const active = 'px-3 py-2 bg-emerald-600 text-white transition-colors';
  const inactive = 'px-3 py-2 text-slate-600 hover:bg-slate-50 transition-colors';
  road.className = currentLayer==='road' ? active : inactive;
  sat.className = currentLayer==='sat' ? active : inactive;
}

document.getElementById('recenterBtn').addEventListener('click', ()=>{
  map.fitBounds(schoolBounds, { padding:[20,20] });
});

/* markers + clustering */
const cluster = L.markerClusterGroup({
  maxClusterRadius: 42,
  spiderfyOnMaxZoom: true,
  showCoverageOnHover: false,
  disableClusteringAtZoom: 21
});
const markerById = {};

function makeIcon(active){
  return L.divIcon({
    className: '',
    html: `<div class="plant-pin${active?' active':''}"><i class="fa-solid fa-seedling"></i></div>`,
    iconSize: [34,34],
    iconAnchor: [17,32],
    popupAnchor: [0,-30]
  });
}

PLANTS.forEach((p, idx) => {
  const marker = L.marker([p.lat, p.lng], { icon: makeIcon(false) });
  marker.bindTooltip(p.name, { direction:'top', offset:[0,-28] });
  marker.on('click', () => openDetail(idx));
  markerById[p.id] = marker;
  cluster.addLayer(marker);
});
map.addLayer(cluster);
map.fitBounds(schoolBounds, { padding:[20,20] });

let activeMarkerId = null;
function highlightMarker(id){
  if(activeMarkerId && markerById[activeMarkerId]) markerById[activeMarkerId].setIcon(makeIcon(false));
  if(id && markerById[id]) markerById[id].setIcon(makeIcon(true));
  activeMarkerId = id;
}

/* ---------- detail screen ---------- */
const detailScreen = document.getElementById('detailScreen');
const detailImg = document.getElementById('detailImg');
const detailImgFallback = document.getElementById('detailImgFallback');
let currentIndex = -1;

function openDetail(idx){
  currentIndex = idx;
  const p = PLANTS[idx];
  highlightMarker(p.id);

  document.getElementById('detailIndex').textContent = `${idx+1} / ${PLANTS.length}`;
  document.getElementById('detailName').textContent = p.name;
  document.getElementById('detailId').textContent = p.id;
  document.getElementById('detailSci').textContent = p.sciName || '';
  document.getElementById('detailDesc').textContent = p.desc || '설명 정보가 없습니다.';

  const meta = document.getElementById('detailMeta');
  meta.innerHTML = `
    <span class="text-[11px] font-semibold text-slate-500 bg-slate-100 px-2.5 py-1 rounded-full">
      <i class="fa-regular fa-calendar mr-1"></i>${(p.date||'').trim() || '날짜 미상'}
    </span>
    <span class="text-[11px] font-semibold text-slate-500 bg-slate-100 px-2.5 py-1 rounded-full">
      <i class="fa-solid fa-location-dot mr-1"></i>${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}
    </span>
  `;

  document.getElementById('statTemp').textContent = fmt(p.temp, '℃');
  document.getElementById('statHumidity').textContent = fmt(p.humidity, '%');
  document.getElementById('statRain').textContent = fmt(p.rain, 'mm', 0);
  document.getElementById('statSun').textContent = fmt(p.sun, 'h', 0);

  detailImgFallback.classList.add('hidden');
  detailImg.classList.remove('hidden');
  detailImg.dataset.attempt = '0';
  detailImg.src = p.photoId ? photoUrl(p.photoId, 0) : '';
  detailImg.alt = p.name;
  if(!p.photoId){ showImgFallback(); }

  const body = document.getElementById('detailBody');
  body.classList.remove('pop-in'); void body.offsetWidth; body.classList.add('pop-in');

  detailScreen.classList.remove('translate-x-full');
  closeList();
}

function showImgFallback(){
  detailImg.classList.add('hidden');
  detailImgFallback.classList.remove('hidden');
}
detailImg.addEventListener('error', () => {
  const attempt = Number(detailImg.dataset.attempt || '0');
  const p = PLANTS[currentIndex];
  if(attempt === 0 && p && p.photoId){
    detailImg.dataset.attempt = '1';
    detailImg.src = photoUrl(p.photoId, 1);
  } else {
    showImgFallback();
  }
});

function closeDetail(){
  detailScreen.classList.add('translate-x-full');
  highlightMarker(null);
}
document.getElementById('backBtn').addEventListener('click', closeDetail);

document.getElementById('showOnMapBtn').addEventListener('click', () => {
  const p = PLANTS[currentIndex];
  closeDetail();
  setTimeout(() => {
    map.setView([p.lat, p.lng], 20, { animate:true });
  }, 150);
});

document.getElementById('prevPlantBtn').addEventListener('click', () => {
  openDetail((currentIndex - 1 + PLANTS.length) % PLANTS.length);
});
document.getElementById('nextPlantBtn').addEventListener('click', () => {
  openDetail((currentIndex + 1) % PLANTS.length);
});

/* ---------- list drawer ---------- */
const listDrawer = document.getElementById('listDrawer');
const listBackdrop = document.getElementById('listBackdrop');
const plantListEl = document.getElementById('plantList');

function renderList(filter=''){
  const f = filter.trim().toLowerCase();
  plantListEl.innerHTML = '';
  PLANTS.forEach((p, idx) => {
    if(f && !p.name.toLowerCase().includes(f) && !(p.sciName||'').toLowerCase().includes(f)) return;
    const item = document.createElement('button');
    item.className = 'flex items-center gap-3 text-left bg-slate-50 hover:bg-emerald-50 border border-slate-100 hover:border-emerald-200 rounded-xl p-2.5 transition-colors';
    item.innerHTML = `
      <div class="w-11 h-11 rounded-lg bg-emerald-100 flex items-center justify-center text-emerald-600 flex-shrink-0 overflow-hidden">
        ${p.photoId ? `<img src="${photoUrl(p.photoId,0)}" class="w-full h-full object-cover" onerror="this.remove()">` : `<i class="fa-solid fa-seedling"></i>`}
      </div>
      <div class="min-w-0">
        <p class="text-sm font-bold text-slate-800 truncate">${escapeHtml(p.name)}</p>
        <p class="text-[11px] text-slate-400 italic truncate">${escapeHtml(p.sciName||'')}</p>
      </div>
    `;
    item.addEventListener('click', () => openDetail(idx));
    plantListEl.appendChild(item);
  });
  if(!plantListEl.children.length){
    plantListEl.innerHTML = `<p class="col-span-full text-center text-sm text-slate-400 py-8">검색 결과가 없습니다.</p>`;
  }
}
renderList();

function openList(){
  listBackdrop.classList.remove('hidden');
  listDrawer.classList.remove('translate-y-full');
}
function closeList(){
  listBackdrop.classList.add('hidden');
  listDrawer.classList.add('translate-y-full');
}
document.getElementById('listBtn').addEventListener('click', openList);
document.getElementById('closeListBtn').addEventListener('click', closeList);
listBackdrop.addEventListener('click', closeList);
document.getElementById('searchInput').addEventListener('input', (e) => renderList(e.target.value));
</script>
</body>
</html>
